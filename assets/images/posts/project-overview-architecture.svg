<svg width="1280" height="860" viewBox="0 0 1280 860" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="860" rx="28" fill="#F7F7F2"/>
  <rect x="40" y="40" width="1200" height="780" rx="24" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="80" y="96" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Online Judge Architecture Overview</text>
  <text x="80" y="130" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="18">Spring Boot web app, MySQL as source of truth, Redis for fast reads, and separate roles for judging and batch processing.</text>

  <rect x="88" y="188" width="220" height="108" rx="24" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="122" y="233" fill="#9A3412" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">User Browser</text>
  <text x="122" y="266" fill="#7C2D12" font-family="Segoe UI, Arial, sans-serif" font-size="17">Problems</text>
  <text x="122" y="290" fill="#7C2D12" font-family="Segoe UI, Arial, sans-serif" font-size="17">Submission / Rank / Contest</text>

  <rect x="412" y="164" width="350" height="154" rx="28" fill="#ECFEFF" stroke="#67E8F9"/>
  <text x="450" y="214" fill="#155E75" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700">Spring Boot Web</text>
  <text x="450" y="248" fill="#155E75" font-family="Segoe UI, Arial, sans-serif" font-size="18">Thymeleaf pages and HTTP endpoints</text>
  <text x="450" y="276" fill="#164E63" font-family="Segoe UI, Arial, sans-serif" font-size="16">Auth / Problem / Submission / User / Rank / Contest</text>
  <text x="450" y="302" fill="#164E63" font-family="Segoe UI, Arial, sans-serif" font-size="16">Receives user requests and starts write/read flows</text>

  <rect x="872" y="152" width="280" height="144" rx="28" fill="#F0FDF4" stroke="#86EFAC"/>
  <text x="908" y="202" fill="#166534" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700">MySQL</text>
  <text x="908" y="234" fill="#166534" font-family="Segoe UI, Arial, sans-serif" font-size="18">Source of truth</text>
  <text x="908" y="262" fill="#14532D" font-family="Segoe UI, Arial, sans-serif" font-size="16">User / Problem / Submission / Result</text>
  <text x="908" y="286" fill="#14532D" font-family="Segoe UI, Arial, sans-serif" font-size="16">Ranking data / Outbox</text>

  <rect x="872" y="356" width="280" height="144" rx="28" fill="#FEF3C7" stroke="#FCD34D"/>
  <text x="908" y="406" fill="#92400E" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700">Redis</text>
  <text x="908" y="438" fill="#92400E" font-family="Segoe UI, Arial, sans-serif" font-size="18">Fast read / coordination store</text>
  <text x="908" y="466" fill="#78350F" font-family="Segoe UI, Arial, sans-serif" font-size="16">Session / Scoreboard</text>
  <text x="908" y="490" fill="#78350F" font-family="Segoe UI, Arial, sans-serif" font-size="16">Dedup / rate-limit helpers</text>

  <rect x="412" y="412" width="350" height="136" rx="28" fill="#F5F3FF" stroke="#C4B5FD"/>
  <text x="448" y="460" fill="#5B21B6" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Judge Role</text>
  <text x="448" y="492" fill="#5B21B6" font-family="Segoe UI, Arial, sans-serif" font-size="18">Consumes submission-related work</text>
  <text x="448" y="520" fill="#4C1D95" font-family="Segoe UI, Arial, sans-serif" font-size="16">Runs judging flow and emits result updates</text>

  <rect x="412" y="600" width="350" height="156" rx="28" fill="#EEF2FF" stroke="#A5B4FC"/>
  <text x="448" y="648" fill="#3730A3" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Batch Role</text>
  <text x="448" y="680" fill="#3730A3" font-family="Segoe UI, Arial, sans-serif" font-size="18">Handles asynchronous maintenance work</text>
  <text x="448" y="708" fill="#312E81" font-family="Segoe UI, Arial, sans-serif" font-size="16">Outbox consume / scoreboard replay</text>
  <text x="448" y="734" fill="#312E81" font-family="Segoe UI, Arial, sans-serif" font-size="16">Streak batch / rank snapshot generation</text>

  <rect x="88" y="548" width="220" height="146" rx="24" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="120" y="595" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700">Gatling</text>
  <text x="120" y="625" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="17">Performance experiments</text>
  <text x="120" y="652" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="16">Step-load, throughput,</text>
  <text x="120" y="676" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="16">failure point verification</text>

  <path d="M309 242H394" stroke="#EA580C" stroke-width="4" stroke-linecap="round"/>
  <path d="M381 231L401 242L381 253" stroke="#EA580C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="322" y="228" fill="#9A3412" font-family="Segoe UI, Arial, sans-serif" font-size="15">HTTP</text>

  <path d="M764 222H854" stroke="#0F766E" stroke-width="4" stroke-linecap="round"/>
  <path d="M841 211L861 222L841 233" stroke="#0F766E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="788" y="208" fill="#0F766E" font-family="Segoe UI, Arial, sans-serif" font-size="15">JPA / Querydsl</text>

  <path d="M764 438H854" stroke="#CA8A04" stroke-width="4" stroke-linecap="round"/>
  <path d="M841 427L861 438L841 449" stroke="#CA8A04" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="793" y="424" fill="#A16207" font-family="Segoe UI, Arial, sans-serif" font-size="15">Session / Scoreboard</text>

  <path d="M588 320V392" stroke="#7C3AED" stroke-width="4" stroke-linecap="round"/>
  <path d="M577 379L588 399L599 379" stroke="#7C3AED" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="612" y="365" fill="#6D28D9" font-family="Segoe UI, Arial, sans-serif" font-size="15">Judge trigger</text>

  <path d="M588 548V580" stroke="#4338CA" stroke-width="4" stroke-linecap="round"/>
  <path d="M577 567L588 587L599 567" stroke="#4338CA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="613" y="569" fill="#4338CA" font-family="Segoe UI, Arial, sans-serif" font-size="15">Async work</text>

  <path d="M764 650H854" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
  <path d="M841 639L861 650L841 661" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="783" y="636" fill="#1D4ED8" font-family="Segoe UI, Arial, sans-serif" font-size="15">Outbox / replay</text>

  <path d="M988 500V628H764" stroke="#B45309" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M777 617L757 628L777 639" stroke="#B45309" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1004" y="568" fill="#92400E" font-family="Segoe UI, Arial, sans-serif" font-size="15">Fast reads + recovery targets</text>

  <path d="M309 620H394" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  <path d="M381 609L401 620L381 631" stroke="#64748B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="317" y="606" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="15">Load test traffic</text>

  <text x="80" y="788" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="16">Profiles in the repo split roles into web, judge, and batch so user-facing traffic and asynchronous work interfere less with each other.</text>
</svg>
